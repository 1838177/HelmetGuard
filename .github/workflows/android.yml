name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug APK
        shell: bash
        run: |
          set +e
          ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace 2>&1 | tee gradle-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### Gradle failure (last 240 lines)'
              echo '```text'
              tail -n 240 gradle-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            branch_name=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
            pr_number=$(gh pr list --head "$branch_name" --state open --json number --jq '.[0].number // empty')
            if [ -n "$pr_number" ]; then
              {
                echo '### Android CI compile failure'
                echo '<details><summary>Last 180 Gradle lines</summary>'
                echo
                echo '```text'
                grep -ni -E '(^e: | error: |FAILURE:|What went wrong|FAILED|failed|Assertion|expected|lint found)' gradle-output.log | tail -n 240
                echo
                echo '--- tail ---'
                tail -n 80 gradle-output.log
                echo '```'
                echo '</details>'
              } > /tmp/gradle-comment.md
              gh pr comment "$pr_number" --body-file /tmp/gradle-comment.md
            fi
          fi
          exit "$status"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helmetguard-reports
          path: |
            app/build/reports/
            app/build/test-results/
            gradle-output.log
          if-no-files-found: ignore
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: helmetguard-debug
          path: app/build/outputs/apk/debug/*.apk

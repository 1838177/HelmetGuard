name: Android CI

on:
  push:
    branches: [main, arena/01a0f73c-helmetguard]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug APK
        shell: bash
        run: |
          set +e
          ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace 2>&1 | tee gradle-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### Gradle failure (last 240 lines)'
              echo '```text'
              tail -n 240 gradle-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helmetguard-reports
          path: |
            app/build/reports/
            app/build/test-results/
            gradle-output.log
          if-no-files-found: ignore
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: helmetguard-debug
          path: app/build/outputs/apk/debug/*.apk

name: ESP32-S3 Firmware CI

on:
  push:
    branches: [main]
    paths: [firmware/**, .github/workflows/firmware.yml]
  pull_request:
    branches: [main]
    paths: [firmware/**, .github/workflows/firmware.yml]

permissions:
  contents: read
  pull-requests: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install platformio==6.1.18
      - name: Protocol unit tests
        run: set -o pipefail; pio test --project-dir firmware --environment native 2>&1 | tee firmware-test.log
      - name: Build ESP32-S3 firmware
        run: set -o pipefail; pio run --project-dir firmware --environment esp32-s3-devkitc-1 2>&1 | tee firmware-build.log
      - name: Report firmware failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### ESP32-S3 firmware CI failure'
            echo '```text'
            tail -n 180 firmware-test.log 2>/dev/null || true
            tail -n 180 firmware-build.log 2>/dev/null || true
            echo '```'
          } > /tmp/firmware-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/firmware-comment.md
